name: governance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly drift check (Monday 06:00 UTC)
  workflow_dispatch:

jobs:
  unit-tests:
    name: unit tests (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'requests>=2.32' 'pytest>=8' 'ruff>=0.6'
      - run: python -m pytest tests/unit
      - run: ruff check src tests scripts

  live-drift-check:
    name: live AC verification (read-only)
    # GITHUB_TOKEN cannot read branch protection: the `administration` scope is
    # not grantable to GITHUB_TOKEN (docs: "If you need a token that requires
    # permissions that aren't available in the GITHUB_TOKEN, ... store [a PAT]
    # as a secret"). The drift check therefore needs a PAT with admin on this
    # repo stored as the GOVERNANCE_TOKEN secret — and skips loudly, without
    # failing, when that secret is absent.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'requests>=2.32' 'pytest>=8'
      - name: verify governance drift (requires GOVERNANCE_TOKEN secret)
        env:
          GOVERNANCE_LIVE: "1"
          GH_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::GOVERNANCE_TOKEN secret is not set — live drift check skipped. Add a PAT with repo admin access as a repository secret named GOVERNANCE_TOKEN to enable it."
            exit 0
          fi
          python -m pytest tests/live -m live -v

