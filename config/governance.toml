# Desired state for GitHub governance — applied by `make apply`, verified by
# `make test-live`. This file is the single source of truth.
#
# Docs: protected branches are available in public repos on GitHub Free, and in
# private repos only with GitHub Pro/Team/Enterprise:
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches

[repository]
owner = "ismail-ougamane"
name = "GitHub_Analytics_Data_Engineering_Flow"
visibility = "public"
# Fail-fast guard: a private repo cannot satisfy AC-2/AC-3 on GitHub Free.
# Flip this to true ONLY after upgrading the account plan.
allow_private = false
description = "End-to-end GitHub analytics data engineering flow"

[branch_protection]
branch = "main"
required_approving_review_count = 1   # AC-2: >= 1 approval
dismiss_stale_reviews = true          # new commits invalidate approvals
require_code_owner_reviews = false    # D9: until >=2 humans exist
require_last_push_approval = true     # latest push must be the reviewed one
enforce_admins = true                 # AC-3: admins cannot bypass
allow_force_pushes = false            # D5
allow_deletions = false               # D5
required_linear_history = true
required_conversation_resolution = true

# Every teammate gets write access (AC-1). NOTE: a single maintainer can never
# merge, because GitHub forbids self-approval (decision D7).
